name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 构建（tsc -b && vite build）
        run: npm run build

      - name: 验证（导出闭环 / 等距头部 / 作品库备份）
        run: npm run verify
