name: Deploy to GitHub Pages

# 只在 main 分支的推送（以及手动触发）时部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限：读仓库、写 Pages、拿 OIDC token。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧部署。
concurrency:
  group: pages
  cancel-in-progress: true

# action 版本在 2026-10-16 用 GitHub API 核对过各仓库的最新主版本标签
# （官方 README 里的示例版本落后于 release，别照抄 README）。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.ts 里已设 base: '/mc-skin-editor/'，产物资源按子路径引用。
      # 本项目路由是 URL hash（#/draw 等），静态托管无需任何 SPA 回退配置。
      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
